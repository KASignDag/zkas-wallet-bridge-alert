name: Seed wallet bridge edition

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/seed-wallet-edition.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wallet alert repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stop if already seeded
        id: seeded
        shell: bash
        run: |
          if [ -f .wallet-edition-seeded ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy proven alert core and convert to wallet edition
        if: steps.seeded.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp README.md /tmp/wallet-readme.md
          git clone --depth 1 https://github.com/KASignDag/zkas-dual-alert.git /tmp/zkas-dual-alert
          rsync -a --exclude '.git' --exclude '.github/workflows' /tmp/zkas-dual-alert/ ./
          cp /tmp/wallet-readme.md README.md

          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          replacements = [
              ('ZKas Dual Alert', 'ZKas Wallet Bridge Alert'),
              ('ZKasDualAlert', 'ZKasWalletBridgeAlert'),
              ('zkas-dual-alert', 'zkas-wallet-bridge-alert'),
              ('zkas_dual_alert.py', 'zkas_wallet_bridge_alert.py'),
              ('http://127.0.0.1:3033', 'http://127.0.0.1:18114'),
              ('127.0.0.1:3033', '127.0.0.1:18114'),
              ('127.0.0.1:3040', '127.0.0.1:3041'),
              ('"port": 3040', '"port": 3041'),
              ('\\ZKasDualAlert', '\\ZKasWalletBridgeAlert'),
              ('RELEASE_NOTES_v0.2.2.md', 'RELEASE_NOTES_v0.1.0.md'),
              ('v0.2.2', 'v0.1.0'),
              ('"0.2.2"', '"0.1.0"'),
          ]

          skip = {Path('.github/workflows/seed-wallet-edition.yml'), Path('README.md')}
          text_exts = {'.py', '.ps1', '.md', '.json', '.yml', '.yaml', '.cmd', '.sh', '.txt', '.gitignore'}
          for p in root.rglob('*'):
              if not p.is_file() or p in skip or '.git' in p.parts:
                  continue
              if p.suffix.lower() not in text_exts and p.name != '.gitignore':
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for old, new in replacements:
                  s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')

          old = Path('zkas_dual_alert.py')
          new = Path('zkas_wallet_bridge_alert.py')
          if old.exists():
              old.replace(new)

          old_notes = Path('RELEASE_NOTES_v0.2.2.md')
          new_notes = Path('RELEASE_NOTES_v0.1.0.md')
          if old_notes.exists():
              old_notes.replace(new_notes)

          app = Path('app.py')
          if app.exists():
              s = app.read_text(encoding='utf-8')
              s = s.replace('Independent read-only companion for compatible ZKas/Kaspa solo-dual-mode bridges.',
                            'Independent read-only companion for the ZKas Desktop Wallet managed KAS + ZKAS bridge.')
              app.write_text(s, encoding='utf-8')

          notes = Path('RELEASE_NOTES_v0.1.0.md')
          if notes.exists():
              original = notes.read_text(encoding='utf-8')
              notes.write_text(
                  '# ZKas Wallet Bridge Alert v0.1.0\n\n'
                  'Initial wallet-specific release, based on the proven ZKas Dual Alert v0.2.2 monitor core.\n\n'
                  '- Default wallet bridge dashboard/API: `http://127.0.0.1:18114`\n'
                  '- Separate local web UI: `http://127.0.0.1:3041`\n'
                  '- Separate Windows install folder and Scheduled Task name\n'
                  '- Supports the ZKas Desktop Wallet managed `solo-dual-bridge v1.0.7` telemetry\n'
                  '- Read-only alerts for ZKAS blocks, KAS blocks, bridge offline/recovery, Email, and Discord\n\n'
                  '## Upstream core history\n\n' + original,
                  encoding='utf-8')

          Path('.wallet-edition-seeded').write_text('wallet-edition v0.1.0\n', encoding='utf-8')
          PY

      - name: Run parser and notification tests
        if: steps.seeded.outputs.done != 'true'
        run: python3 -m unittest discover -s tests -v

      - name: Commit wallet edition
        if: steps.seeded.outputs.done != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build initial ZKas Wallet Bridge Alert v0.1.0"
          git push
