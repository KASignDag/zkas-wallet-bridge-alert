name: apply-recovery-fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-recovery-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch recovery state persistence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('monitor.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('APP_VERSION = "0.1.0"', 'APP_VERSION = "0.1.1"', 1)
          s = s.replace('return {"seen": [], "reward_seen": [], "counts": {"ZKAS": 0, "KAS": 0}}', 'return {"seen": [], "reward_seen": [], "counts": {"ZKAS": 0, "KAS": 0}, "bridge_down": False}')
          s = s.replace('    failures = 0\n    down_alerted = False\n', '    failures = 0\n    down_alerted = bool(state.get("bridge_down", False))\n', 1)
          s = s.replace('            if failures and down_alerted and alerts.get("bridge_recovered", True):', '            if down_alerted and alerts.get("bridge_recovered", True):', 1)
          s = s.replace('            state = {"seen": sorted(seen), "reward_seen": sorted(reward_seen), "counts": counts, "last_source": snap.source, "updated": int(time.time())}', '            state = {"seen": sorted(seen), "reward_seen": sorted(reward_seen), "counts": counts, "last_source": snap.source, "bridge_down": False, "updated": int(time.time())}', 1)
          marker = '                down_alerted = True\n'
          replacement = marker + '                state = {"seen": sorted(seen), "reward_seen": sorted(reward_seen), "counts": counts, "last_source": state.get("last_source", "unknown"), "bridge_down": True, "updated": int(time.time())}\n                save_state(state_path, state)\n'
          if marker not in s:
              raise SystemExit('down-alert marker missing')
          s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding='utf-8')

          app = Path('app.py')
          a = app.read_text(encoding='utf-8').replace('APP_VERSION = "0.1.0"', 'APP_VERSION = "0.1.1"', 1)
          app.write_text(a, encoding='utf-8')

          Path('RELEASE_NOTES_v0.1.1.md').write_text('# ZKas Wallet Bridge Alert v0.1.1\n\n- Persists bridge-down state in `state.json`.\n- Sends `✅ Bridge recovered` after the alert process or PC restarts while the bridge is down.\n- Clears persisted outage state once the bridge responds again.\n- Includes a reboot/restart recovery regression test.\n', encoding='utf-8')
          PY

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor.py app.py tests/test_recovery.py RELEASE_NOTES_v0.1.1.md
          git commit -m "Persist bridge recovery state across reboots"
          git push
